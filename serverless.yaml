org: rantdocperopeko
app: rantdoc
service: my-service

useDotenv: true

provider:
  name: aws
  runtime: nodejs24.x
  region: eu-north-1
  environment:
    SUPABASE_URL: ${env:SUPABASE_URL}
    CORS_ORIGIN1: ${env:CORS_ORIGIN1}
    CORS_ORIGIN2: ${env:CORS_ORIGIN2}
    CORS_ORIGIN3: ${env:CORS_ORIGIN3}
    CORS_ORIGIN4: ${env:CORS_ORIGIN4}
    CORS_ORIGIN5: ${env:CORS_ORIGIN5}
    CORS_ORIGIN6: ${env:CORS_ORIGIN6}
    CORS_ORIGIN7: ${env:CORS_ORIGIN7}
    SUPABASE_ANON_KEY: ${env:SUPABASE_ANON_KEY}
    R2_ENDPOINT: ${env:R2_ENDPOINT}
    R2_USER_ACCESS_KEY_ID: ${env:R2_USER_ACCESS_KEY_ID}
    R2_USER_SECRET_KEY_ID: ${env:R2_USER_SECERT_KEY_ID}
    R2_BUCKET: ${env:R2_BUCKET}
    R2_PUBLIC_DOMAIN: ${env:R2_PUBLIC_DOMAIN}
    PORT: ${env:PORT}

  # ✅ ADD THIS: HTTP API CORS config
  httpApi:
    cors:
      allowedOrigins:
        - ${env:CORS_ORIGIN1}
        - ${env:CORS_ORIGIN2}
        - ${env:CORS_ORIGIN3}
        - ${env:CORS_ORIGIN4}
        - ${env:CORS_ORIGIN5}
        - ${env:CORS_ORIGIN6}
        - ${env:CORS_ORIGIN7}
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      allowCredentials: true
      maxAge: 86400

build:
  esbuild:
    external:
      - wasm-vips

functions:
  api:
    handler: src/lambda.handler
    timeout: 120
    memorySize: 1024
    events:
      - httpApi: "*" # This uses HTTP API Gateway v2

plugins:
  - serverless-offline
